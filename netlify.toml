# Netlify configuration for Noble Community Support (Vite + React SPA)
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "apps/web/dist"
  # Use Node 20 for consistent builds
  environment = { NODE_VERSION = "20" }

# SPA fallback: serve index.html for all routes so React Router works
# on direct links and refresh (e.g. /about, /services, /contact)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional: security and caching headers for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
